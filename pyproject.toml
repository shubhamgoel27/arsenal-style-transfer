[project]
name = "arsenal-style-transfer"
version = "0.1.0"
description = "Convert Arsenal FC highlight clips into different animation styles"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "yt-dlp>=2024.0",
    "opencv-python>=4.9",
    "Pillow>=10.0",
    "scenedetect[opencv]>=0.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "google-genai>=1.0",
    # Local SD style transfer (runs on Apple Silicon via MPS)
    "torch>=2.2",
    "diffusers>=0.32",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[project.scripts]
ast-cli = "src.cli:app"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
